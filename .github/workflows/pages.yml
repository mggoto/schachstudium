name: Schachstudium veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Europe/Zurich'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Partien validieren
        run: npm run validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stockfish installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          python -m pip install --disable-pip-version-check chess
      - name: Stellungsbewertungen vorberechnen
        run: python scripts/generate_evaluations.py
      - name: Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Webseite packen
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
